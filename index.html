<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bina Ayat di Zoo</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(#83d9ff,#b9ee8a);color:#26374d}.wrap{max-width:760px;margin:auto;padding:12px}.head,.card{background:#fff2c6;border:4px solid #a66b27;border-radius:24px;padding:18px;margin:12px 0;box-shadow:0 5px #8c5824}.head{text-align:center;background:#ffd276}h1{font-size:clamp(27px,6vw,42px);color:#193d94;margin:0}h2{margin:8px 0}.stats{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}.stats span{background:white;border:2px solid #87acc7;border-radius:20px;padding:9px;font-weight:800}.scene{text-align:center;background:linear-gradient(#c2edff,#b0e48a);border:3px solid white;border-radius:16px;padding:16px;margin:12px 0}.art{font-size:clamp(56px,13vw,90px)}button{cursor:pointer;font-family:inherit}.option,.btn{display:block;width:100%;padding:13px;margin:9px 0;border:3px solid #8ea7c1;border-radius:18px;background:white;color:#25354b;text-align:left;font-weight:750;font-size:clamp(17px,4vw,21px)}.btn{text-align:center;background:#29b744;border-color:#147b2e;color:white}.btn.alt{background:#2285d5;border-color:#135a9b}.btn:disabled{opacity:.45}.option:disabled{opacity:.85}.option.correct{background:#a7edb2;border-color:#24983c}.option.wrong{background:#ffc0c0;border-color:#c73434}.feedback{background:white;border-radius:14px;padding:12px;min-height:52px}.tip{background:#e0f5ff;border-radius:12px;padding:12px}.hidden{display:none}input{width:100%;padding:13px;font-size:20px;border:2px solid #91a8bb;border-radius:14px}small{color:#526174}footer{text-align:center;padding:12px}</style></head><body><div class="wrap"><div class="head"><h1>🐾 Bina Ayat di Zoo 🦒</h1><b>Kata Kerja + Kata Nama · 动词 + 名词</b></div><section id="home" class="card"><h2>Selamat Datang! 欢迎</h2><p>Nama murid / 学生名字</p><input id="name" placeholder="Masukkan nama"><p>每次10题 · 即时反馈 · 华文解释 · 错题复习</p><button class="btn" onclick="start()">Mula Bermain ▶ 开始游戏</button><button class="btn alt" onclick="history()">Rekod Saya / 我的记录</button><div id="records"></div></section><section id="game" class="hidden"><div class="stats"><span id="student"></span><span id="count"></span><span id="score"></span></div><div class="card"><div class="scene"><div class="art" id="art"></div><strong id="scene"></strong></div><h2>Pilih ayat yang betul. 选择正确句子</h2><div id="choices"></div><p id="feedback" class="feedback">请选择答案。</p><p id="tip" class="tip"></p><button id="next" class="btn" disabled onclick="next()">Soalan Seterusnya ➜ 下一题</button></div></section><section id="done" class="card hidden"><h2>🎉 Tamat! 完成</h2><h2 id="result"></h2><div id="review"></div><button class="btn" onclick="start()">Main Lagi / 再玩一次</button><button class="btn alt" onclick="show('home')">Laman Utama / 首页</button></section><footer>Zoo Bina Ayat · Bahasa Melayu</footer></div><script>
const bank=[
['👨‍👩‍👧‍👦 🦒 🐘','Lawatan ke zoo','melawat','zoo','参观','Saya sekeluarga melawat zoo.','Saya sekeluarga memakan zoo.','Zoo melawat keluarga saya.'],
['🐅 🔊','Harimau di dalam sangkar','mengaum','harimau','咆哮','Seekor harimau mengaum di dalam sangkar.','Harimau itu membaca buku.','Sangkar mengaum kepada harimau.'],
['🐒 🌳','Monyet di pokok','bergayut','monyet','攀吊','Seekor monyet bergayut pada dahan pokok.','Pokok bergayut pada monyet.','Monyet itu memandu kereta.'],
['👦 📷 🐘','Ali dan gajah','mengambil gambar','gajah','拍照','Ali mengambil gambar seekor gajah.','Ali mengambil seekor gajah.','Gajah mengambil gambar Ali.'],
['👧 👦 🦭 ⚽','Pertunjukan haiwan','menyaksikan','pertunjukan','观看','Murid-murid menyaksikan pertunjukan haiwan.','Pertunjukan menyaksikan murid-murid.','Murid-murid memakan pertunjukan.'],
['👩 🥬 🐘','Penjaga zoo dan gajah','memberikan','makanan','给予','Penjaga zoo memberikan makanan kepada gajah.','Gajah memberikan penjaga zoo kepada makanan.','Makanan memberikan gajah kepada penjaga zoo.'],
['🦧 🌳','Orang utan di pokok','bergayut','orang utan','攀吊','Seekor orang utan bergayut pada dahan pokok.','Dahan pokok bergayut pada orang utan.','Orang utan mengaum seperti harimau.'],
['👨 📷 🐅','Pengunjung dan harimau','mengambil gambar','pengunjung','拍照','Seorang pengunjung mengambil gambar harimau.','Harimau mengambil gambar pengunjung.','Pengunjung bergayut pada harimau.'],
['🐘 ✨','Gajah yang besar','mengagumkan','gajah','令人惊叹','Saiz gajah itu sangat mengagumkan.','Saiz gajah itu sedang melawat.','Gajah mengambil gambar saiz.'],
['👨‍👩‍👧 🦒','Keluarga di zoo','melihat','zirafah','观看','Keluarga saya melihat zirafah di zoo.','Zirafah melihat zoo di keluarga.','Keluarga saya mengaum zirafah.'],
['🐅 👧','Harimau dan pengunjung','mengaum','sangkar','咆哮','Harimau itu mengaum dengan kuat di dalam sangkar.','Harimau itu bergayut pada kamera.','Pengunjung mengaum di dalam pokok.'],
['👦 👧 🐘','Kanak-kanak di zoo','melawat','keluarga','参观','Kanak-kanak melawat zoo bersama keluarga.','Zoo melawat kanak-kanak bersama keluarga.','Kanak-kanak memberikan zoo kepada keluarga.']];
let qs=[],i=0,pts=0,wrong=[],answered=false,student='';const el=x=>document.getElementById(x);function show(id){['home','game','done'].forEach(x=>el(x).classList.toggle('hidden',x!==id))}function shuffle(a){for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}function start(){student=el('name').value.trim()||'Murid';qs=shuffle([...bank]).slice(0,10);i=0;pts=0;wrong=[];show('game');render()}function render(){answered=false;let q=qs[i];el('student').textContent='👤 '+student;el('count').textContent=(i+1)+'/10';el('score').textContent='⭐ Markah: '+pts;el('art').textContent=q[0];el('scene').textContent=q[1];el('feedback').textContent='请选择答案。';el('tip').textContent='Kata kerja: '+q[2]+'（'+q[4]+'） · Kata nama: '+q[3];el('next').disabled=true;el('next').textContent=i===9?'Lihat Keputusan / 查看成绩':'Soalan Seterusnya ➜ 下一题';el('choices').replaceChildren();shuffle([q[5],q[6],q[7]]).forEach((v,j)=>{let b=document.createElement('button');b.className='option';b.textContent='ABC'[j]+'. '+v;b.onclick=()=>answer(v,b);el('choices').appendChild(b)})}function answer(v,b){if(answered)return;answered=true;let q=qs[i],ok=v===q[5];if(ok)pts+=10;else wrong.push(q);document.querySelectorAll('.option').forEach(x=>{x.disabled=true;if(x.textContent.slice(3)===q[5])x.classList.add('correct')});if(!ok)b.classList.add('wrong');el('score').textContent='⭐ Markah: '+pts;el('feedback').textContent=(ok?'✅ Betul! 答对了！':'❌ Salah. 答错了。')+' 正确答案：'+q[5];el('next').disabled=false}function next(){if(++i<10)render();else finish()}function finish(){show('done');el('result').textContent=student+' · '+pts+'/100';el('review').replaceChildren();if(wrong.length){let h=document.createElement('h3');h.textContent='Ulang Kaji / 错题复习';el('review').appendChild(h);wrong.forEach(q=>{let p=document.createElement('p');p.textContent=q[1]+'：'+q[5];el('review').appendChild(p)})}else el('review').textContent='🌟 Tahniah! 全部答对！';try{let a=JSON.parse(localStorage.getItem('zoo_game_records')||'[]');a.unshift({student,score:pts,date:new Date().toLocaleString(),wrong:wrong.map(q=>q[5])});localStorage.setItem('zoo_game_records',JSON.stringify(a.slice(0,100)))}catch(e){}}function history(){el('records').replaceChildren();let h=document.createElement('h3');h.textContent='本设备学习记录';el('records').appendChild(h);try{let a=JSON.parse(localStorage.getItem('zoo_game_records')||'[]');if(!a.length)el('records').append('暂无记录');a.forEach(r=>{let p=document.createElement('p');p.textContent=r.date+' · '+r.student+' · '+r.score+'/100';el('records').appendChild(p)})}catch(e){el('records').append('无法读取记录')}}
</script></body></html>
